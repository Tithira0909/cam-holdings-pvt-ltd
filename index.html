<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Crown Asia Majestic | Premium Property Development</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              luxury: {
                white: '#FFFFFF',
                offwhite: '#F8F8F8',
                black: '#0B0B0B',
                charcoal: '#111111',
                gold: '#EAC137', 
                golddark: '#D4AF37', 
                goldlight: '#F4D472', 
                border: '#E9E9E9',
                gray: '#757575'
              }
            },
            fontFamily: {
              sans: ['Ubuntu', 'sans-serif'],
              serif: ['Bricolage Grotesque', 'sans-serif'],
            },
            letterSpacing: {
              'luxury': '0.15em',
              'brand': '0.25em',
            },
            borderRadius: {
              'xl': '16px',
              '2xl': '20px',
            },
            boxShadow: {
              'gold-glow': '0 4px 15px rgba(234, 193, 55, 0.4)',
              'gold-glow-lg': '0 10px 25px rgba(234, 193, 55, 0.3)',
            }
          }
        }
      }
    </script>
    <style>



      /* --- Responsive Typography & Spacing --- */
      html { font-size: 16px; }

      @media (max-width: 1024px) {
        h1 { font-size: 3rem !important; line-height: 1.1 !important; }
        h2 { font-size: 2.5rem !important; line-height: 1.2 !important; }
      }

      @media (max-width: 768px) {
        html { font-size: 14px; }

        /* Typography */
        h1 { font-size: 2.25rem !important; line-height: 1.15 !important; }
        h2 { font-size: 1.75rem !important; line-height: 1.25 !important; }
        h3 { font-size: 1.25rem !important; }
        h4 { font-size: 1.125rem !important; }
        p { font-size: 1rem !important; line-height: 1.6 !important; }

        .nav-link, .nav-item { font-size: 1rem !important; }

        /* Spacing & Layout */
        .px-mobile { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }
        .py-section, .pt-32, .pb-24, .py-20, .py-24, .py-16 {
          padding-top: 3rem !important;
          padding-bottom: 3rem !important;
        }
        .mb-20, .mb-16, .mb-12 { margin-bottom: 2rem !important; }
        .gap-12, .gap-16, .gap-20 { gap: 1.5rem !important; }

        /* Admin Tables */
        .admin-table-container {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          width: 100%;
        }
        table { font-size: 0.875rem !important; }

        /* General Overflow Prevention */
        body, main, section {
          max-width: 100vw;
          overflow-x: hidden;
        }
      }

      @media (max-width: 480px) {
        /* Mobile Portrait Tweaks */
        h1 { font-size: 1.75rem !important; }
        h2 { font-size: 1.5rem !important; }
        .px-mobile { padding-left: 1rem !important; padding-right: 1rem !important; }
        .py-section, .pt-32, .pb-24, .py-20, .py-24, .py-16 {
          padding-top: 2rem !important;
          padding-bottom: 2rem !important;
        }
      }

      /* Custom scrollbar for premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #dc2626; /* red-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b91c1c; /* red-700 */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="selection:bg-red-600 selection:text-white bg-gray-50 text-gray-900">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
